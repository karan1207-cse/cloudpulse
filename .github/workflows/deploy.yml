# Manual deployment only. Never runs on push or pull request.
# Requires (see docs/DEPLOYMENT.md):
#   - a GitHub environment named "production" with required reviewers,
#   - secrets AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, TF_VARS (terraform.tfvars contents),
#   - the OIDC deploy role created once by an administrator.
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (false = plan only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests before deploying
        working-directory: .
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cloudpulse-deploy-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Write tfvars and backend config
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          printf '%s\n' "$TF_VARS" > terraform.tfvars
          cat > backend.tf <<HCL
          terraform {
            backend "s3" {
              bucket       = "${TF_STATE_BUCKET}"
              key          = "cloudpulse/prod/terraform.tfstate"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          HCL
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - name: Apply (only when requested)
        if: ${{ inputs.apply }}
        run: terraform apply -input=false tfplan
